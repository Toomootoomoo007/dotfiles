# wp-backup サイト設定の例
# コピー先: ~/.config/wp-backup/sites/<site-id>.conf
#
#   mkdir -p ~/.config/wp-backup/sites
#   cp site.example.conf ~/.config/wp-backup/sites/nigawa.conf
#   # 編集してから: wp-backup

LABEL="表示名（対話メニュー用）"
SSH_HOST="sakura"
# ローカルにある DB 接続情報（REMOTE_DB_HOST / USER / PASSWORD / NAME を定義）
DB_CREDENTIALS="$HOME/path/to/prod-credentials.env"
# リモートの uploads 絶対パス（フルバックアップ時）。~ はリモート側で解釈される想定なら
# /home/USER/... の絶対パスを推奨
REMOTE_UPLOADS="/home/USER/www/example/wp-content/uploads"
DEFAULT_BACKUP_DIR="$HOME/Backups/wp/example"
